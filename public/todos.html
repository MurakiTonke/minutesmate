<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MinutesMate — ToDo一覧</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="topbar">
  <a href="dashboard.html">← ダッシュボードに戻る</a>
  <a href="new-meeting.html">＋ 新しい議事録</a>
</div>

<header>
  <h1>ToDo一覧</h1>
  <p class="tagline">期限が近い順に表示しています</p>
</header>

<main>
  <section class="card">
    <table id="todos-table" class="todos-table">
      <thead>
        <tr><th>完了</th><th>内容</th><th>担当者</th><th>期限</th><th>操作</th></tr>
      </thead>
      <tbody id="todos-body"></tbody>
    </table>
    <p id="empty-msg" class="hidden">ToDoはまだありません。</p>
  </section>
</main>

<script type="module" src="js/todos.js"></script>
</body>
</html>
